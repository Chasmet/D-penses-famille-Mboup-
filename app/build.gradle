plugins {
    id 'com.android.application'
}

android {
    namespace 'com.chasmet.depensesfamille'
    compileSdk 34

    defaultConfig {
        applicationId 'com.chasmet.depensesfamille'
        minSdk 21
        targetSdk 34
        versionCode 2
        versionName '1.1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

tasks.register('syncRootBrandImages') {
    doLast {
        def drawableDir = file('src/main/res/drawable')
        drawableDir.mkdirs()

        def logoFile = rootProject.file('logo.png')
        def interfaceFile = rootProject.file('interface.png')

        if (!logoFile.exists()) {
            throw new GradleException('logo.png est introuvable à la racine du dépôt')
        }
        if (!interfaceFile.exists()) {
            throw new GradleException('interface.png est introuvable à la racine du dépôt')
        }

        copy {
            from logoFile
            into drawableDir
            rename { 'logo.png' }
        }
        copy {
            from interfaceFile
            into drawableDir
            rename { 'interface_mboup.png' }
        }
    }
}

preBuild.dependsOn(syncRootBrandImages)
